<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('Policies')}"></head>
    <body>
        <div th:replace="~{layout :: nav}"></div>
        <main class="app-content">
            <header class="page-header"><h1>Policies</h1>
                <p>Policy catalog discovered directly from the AutoShift policy repository.</p></header>
            <rh-card class="table-card">
                <h2 slot="header" class="card-title">Policy Catalog</h2>
                <div class="table-toolbar">
                    <label class="table-filter">
                        <span>Filter</span>
                        <input type="search" placeholder="Filter policies" aria-label="Filter policies">
                    </label>
                </div>
                <div class="table-wrap">
                    <table class="data-table" data-enhanced-table="true">
                        <thead>
                        <tr>
                            <th data-sortable="true">Policy</th>
                            <th data-sortable="true">Tier</th>
                            <th data-sortable="true">Placement rules</th>
                            <th data-sortable="true">Enabled</th>
                            <th data-sortable="true">Clusters</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${report.policySummaries}">
                            <td><a th:href="@{'/policies/' + ${p.policy.name}}" th:text="${p.policy.name}"></a></td>
                            <td>
                                <span class="tier-pill" th:classappend="${'tier-' + p.policy.tier.name().toLowerCase()}" th:text="${p.policy.tier}">stable</span>
                            </td>
                            <td th:text="${p.policy.rules.size()}"></td>
                            <td th:text="${p.enabled}"></td>
                            <td th:text="${p.total}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(report.policySummaries)}"><td colspan="5" class="empty">No policies found.</td></tr>
                        </tbody>
                    </table>
                </div>
            </rh-card>
        </main>
    </body>
</html>
