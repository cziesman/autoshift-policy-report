<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Clusters')}"></head><body>
<div th:replace="~{layout :: nav}"></div>
<main class="app-content">
  <header class="page-header"><h1>Clusters</h1><p>Clusters discovered from the site values repository.</p></header>
  <rh-card class="table-card">
    <h2 slot="header" class="card-title">All Clusters</h2>
    <div class="table-toolbar">
      <label class="table-filter">
        <span>Filter</span>
        <input type="search" placeholder="Filter clusters" aria-label="Filter clusters">
      </label>
    </div>
    <div class="table-wrap"><table class="data-table" data-enhanced-table="true">
      <thead><tr>
        <th data-sortable="true">Cluster</th>
        <th data-sortable="true">ClusterSet</th>
        <th data-sortable="true">Labels</th>
        <th data-sortable="true">Source</th>
      </tr></thead>
      <tbody><tr th:each="c : ${report.clusters}">
        <td><a th:href="@{/clusters/{source}/{name}(source=${c.sourceName},name=${c.name})}" th:text="${c.name}">cluster</a></td>
        <td>
          <a th:if="${clusterSetsByClusterId[c.id] != null}"
             th:href="@{/clustersets/{type}/{source}/{name}(type=${clusterSetsByClusterId[c.id].type},source=${clusterSetsByClusterId[c.id].sourceName},name=${clusterSetsByClusterId[c.id].name})}"
             th:text="${clusterSetsByClusterId[c.id].name}">managed</a>
          <span th:if="${clusterSetsByClusterId[c.id] == null}" th:text="${c.clusterSet ?: 'unassigned'}">managed</span>
        </td>
        <td th:text="${#maps.size(c.labels)}">0</td>
        <td class="muted" th:text="${c.sourceName}">source.yaml</td>
      </tr>
      <tr th:if="${#lists.isEmpty(report.clusters)}"><td colspan="4" class="empty">No clusters found.</td></tr>
      </tbody>
    </table></div>
  </rh-card>
</main></body></html>
