apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-tempo
spec:
  clusterSets:
    - managed
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: autoshift.io/tempo
              operator: In
              values:
                - 'true'
