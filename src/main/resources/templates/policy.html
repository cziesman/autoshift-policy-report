<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Policy')}"></head><body>
<div th:replace="~{layout :: nav}"></div>
<main class="app-content">
<header class="page-header"><h1 th:text="${summary.policy.name}">policy</h1>
<div class="meta"><span class="tier-pill" th:classappend="${'tier-' + summary.policy.tier.name().toLowerCase()}" th:text="${summary.policy.tier}">stable</span>
<span>Enabled on <strong th:text="${summary.enabled}">0</strong> of <strong th:text="${summary.total}">0</strong> clusters.</span></div></header>
<div class="grid grid-2">
  <rh-card><div class="stat-card"><div class="metric-icon policies small">◈</div><div class="stat-content"><div class="stat-label">Placement rules</div><div class="stat-value" th:text="${summary.policy.rules.size()}">0</div></div></div></rh-card>
  <rh-card><div class="stat-card"><div class="metric-icon implemented small">✓</div><div class="stat-content"><div class="stat-label">Implemented</div><div class="stat-value" th:text="${summary.enabled}">0</div><div class="stat-note">of <span th:text="${summary.total}">0</span> clusters</div></div></div></rh-card>
</div>
<div class="section-gap"></div>
<rh-card>
<h2 slot="header" class="card-title">Implementation by Cluster</h2>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Cluster</th><th>Status</th><th>Source</th></tr></thead>
<tbody><tr th:each="c : ${summary.clusters}">
<td><a th:href="@{/clusters/{source}/{name}(source=${c.sourceName},name=${c.cluster})}" th:text="${c.cluster}"></a></td>
<td><span class="status-text" th:classappend="${c.state.name().toLowerCase().replace('_','-')}" th:text="${c.state}"></span></td><td th:text="${c.source}"></td>
</tr></tbody></table></div>
</rh-card>
</main></body></html>
