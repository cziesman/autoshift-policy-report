apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gitops
spec:
  clusterSets:
    - managed
    - sbx
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: autoshift.io/openshift-gitops
              operator: In
              values:
                - 'true'
